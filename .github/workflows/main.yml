name: Ubuntu SSH Server (Port 22)

on:
  workflow_dispatch:

jobs:
  start-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install ngrok -y

      - name: Set Password for Runner User
        run: |
          echo "runner:admin12345" | sudo chpasswd

      - name: Start Ngrok SSH Tunnel
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if [ -z "$NGROK_TOKEN" ]; then
            echo "Error: NGROK_AUTH_TOKEN secret is missing!"
            exit 1
          fi

          ngrok config add-authtoken $NGROK_TOKEN
          ngrok tcp 22 --log=stdout > ngrok.log &
          sleep 5

          PUBLIC_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')

          echo "=========================================="
          echo " SSH SERVER IS ACTIVE (PORT 22)"
          echo "=========================================="
          echo "Connection URL : $PUBLIC_URL"
          echo "Username       : runner"
          echo "Password       : admin12345"
          echo "=========================================="

          while true; do
            echo "[$(date)] SSH Server Active at $PUBLIC_URL..."
            sleep 300
          done
          
