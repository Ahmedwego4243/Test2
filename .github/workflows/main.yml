name: Public Socks5 Proxy Server

on:
  workflow_dispatch:

jobs:
  start-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install Dante Server & Ngrok
        run: |
          sudo apt-get update
          sudo apt-get install -y dante-server curl
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install ngrok

      - name: Configure Dante Socks5 Proxy
        run: |
          cat << 'EOF' | sudo tee /etc/danted.conf
          logoutput: stderr
          internal: eth0 port = 1080
          external: eth0
          socksmethod: username
          clientmethod: none
          user.privileged: root
          user.unprivileged: nobody

          client pass {
              from: 0.0.0.0/0 to: 0.0.0.0/0
              log: error
          }

          socks pass {
              from: 0.0.0.0/0 to: 0.0.0.0/0
              log: error
          }
          EOF

          # Create Proxy User
          sudo useradd -m proxyuser || true
          echo "proxyuser:proxy12345" | sudo chpasswd

          # Restart Service
          sudo systemctl restart danted

      - name: Start Ngrok Tunnel & Display Connection Info
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if [ -z "$NGROK_TOKEN" ]; then
            echo "Error: NGROK_AUTH_TOKEN secret is missing!"
            exit 1
          fi

          ngrok config add-authtoken $NGROK_TOKEN
          ngrok tcp 1080 --log=stdout > ngrok.log &
          sleep 5

          # Extract Public Address
          PUBLIC_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          
          echo "=========================================="
          echo " PUBLIC SOCKS5 PROXY ACTIVE (NO TAILSCALE)"
          echo "=========================================="
          echo "Connection URL : $PUBLIC_URL"
          echo "Username       : proxyuser"
          echo "Password       : proxy12345"
          echo "=========================================="
          
          # Keep session running
          while true; do
            echo "[$(date)] Proxy active via $PUBLIC_URL..."
            sleep 300
          done
